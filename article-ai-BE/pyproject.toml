[project]
name = "article-post-agent"
version = "0.1.0"
description = "Article Post Agent with crewAI will help you to post articles on your blog."
authors = [
    { name = "Shubham Srivastava", email = "shubhams@geekyants.com" },
]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.76.2",
    "pandas",
    "tabulate",
    "langchain-openai"
]

[project.scripts]
article_post_agent = "crew.run:job"
run_crew = "crew.run:job"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew"]  # Add this section to point to your src directory